name: Test Piped Logic
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify deno is on PATH
        run: deno --version

      - name: Pub get
        run: dart pub get

      - name: Run test
        run: dart run bin/piped_test.dart
